networks:
  syslab_network:
    driver: bridge

services:
  db:
    image: postgres:15-alpine
    container_name: syslab_db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: gym_db
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d gym_db"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - syslab_network

  backend:
    build:
      context: ./backend
    container_name: syslab_backend
    restart: always
    working_dir: /app
    volumes:
      - ./backend:/app
      - /app/node_modules
    command: node src/index.js
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: "postgresql://postgres:postgrespassword@db:5432/gym_db?schema=public"
      PORT: 3000
    depends_on:
      db:
        condition: service_healthy
    networks:
      - syslab_network

  frontend:
    build:
      context: ./frontend
    container_name: syslab_frontend
    restart: unless-stopped
    ports:
      - "5174:5173"
    depends_on:
      - backend
    networks:
      - syslab_network
