version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: syslab_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: syslab_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build: ./backend
    container_name: syslab_backend
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: "postgresql://postgres:postgres@db:5432/syslab_db?schema=public"
    depends_on:
      - db

  frontend:
    build: ./frontend
    container_name: syslab_frontend
    ports:
      - "5174:5173"
    depends_on:
      - backend

volumes:
  postgres_data:
